<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문래한잔 성신점</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14110f; --card:#1e1a17; --line:#2e2824;
    --text:#f2ebe3; --sub:#a39788; --point:#d9a35b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;line-height:1.5;max-width:480px;margin:0 auto}

  /* 홈 */
  .home{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:40px 20px}
  .home header{text-align:center;margin-bottom:40px}
  .store{font-family:'Noto Serif KR',serif;font-size:30px}
  .branch{color:var(--point);font-size:12px;letter-spacing:.3em;margin-top:6px}
  .intro{color:var(--sub);font-size:14px;margin-top:16px;white-space:pre-line}
  .big-btn{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;margin-bottom:12px;color:var(--text);text-decoration:none}
  .big-btn.primary{background:var(--point);border-color:var(--point);color:var(--bg)}
  .big-btn b{display:block;font-size:19px}
  .big-btn small{display:block;font-size:13px;opacity:.75;margin-top:2px}
  .big-btn i{font-style:normal;font-size:20px}
  .info{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .info-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0}
  .info-row span:first-child{color:var(--sub)}
  .links{display:flex;gap:8px;margin-top:12px}
  .links a{flex:1;text-align:center;padding:10px;border-radius:10px;background:var(--line);color:var(--text);text-decoration:none;font-size:13px}

  /* 상단바 */
  .topbar{position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
  .topbar-row{display:flex;align-items:center;gap:4px;padding:10px 8px}
  .back{color:var(--text);text-decoration:none;font-size:22px;padding:4px 12px}
  .topbar-title{font-weight:500}

  /* 첫 방문 */
  .guide{padding:24px 20px 8px}
  .guide-block{margin-bottom:36px}
  .guide-block img{display:block;width:100%;border-radius:14px;margin-bottom:14px}
  .guide-block h2{font-family:'Noto Serif KR',serif;font-size:20px;margin-bottom:8px}
  .guide-block p{color:var(--sub);font-size:15px;white-space:pre-line}
  .to-menu{display:block;text-align:center;background:var(--point);color:var(--bg);padding:16px;border-radius:14px;text-decoration:none;font-weight:700;margin:0 20px 48px}

  /* 미니게임 목록 */
  .games{padding:20px}
  .games .big-btn{justify-content:flex-start;gap:14px}
  .game-emoji{font-size:32px;line-height:1}
  .game-text{flex:1}
  .game-loading{padding:60px 20px;text-align:center;color:var(--sub)}

  /* 메뉴판 */
  nav{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex-shrink:0;background:none;border:1px solid var(--line);color:var(--sub);padding:8px 14px;border-radius:20px;font-size:14px;font-family:inherit}
  nav button.on{border-color:var(--point);color:var(--point)}
  section{padding:28px 20px 8px;scroll-margin-top:110px}
  section h2{font-family:'Noto Serif KR',serif;font-size:20px;margin-bottom:4px}
  .cat-desc{color:var(--sub);font-size:13px;margin-bottom:8px}
  .item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .item img{width:72px;height:72px;object-fit:cover;border-radius:10px;flex-shrink:0}
  .item-body{flex:1}
  .item-top{display:flex;justify-content:space-between;gap:12px}
  .name{font-weight:500}
  .price{color:var(--point);white-space:nowrap}
  .desc{color:var(--sub);font-size:13px;margin-top:4px}
  .badge{display:inline-block;font-size:11px;color:var(--bg);background:var(--point);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .soldout{opacity:.4}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:40px 20px 60px}
</style>
</head>
<body>
<div id="app"></div>

<script>
// =====================================================
// ✏️ 여기만 수정하면 됩니다
// =====================================================

// ① 매장 기본 정보 (첫 화면)
const STORE = {
  name: "문래한잔",
  branch: "SUNGSHIN",
  intro: "혼자여도 괜찮은 밤,\n위스키 한 잔과 대화가 있는 바",
  firstBtn: ["첫 방문이신가요?", "문래한잔 이용 안내"],
  menuBtn: ["메뉴판은 여기!", "오늘은 뭐 마실까?"],
  gameBtn: ["미니게임 🎮", "옆 손님과 한 판, 메뉴 뽑기까지"],
  info: [
    ["영업시간", "매일 20:00 – 00:00"],
    ["Wi-Fi", "mullae_guest / 12345678"],
  ],
  links: [
    ["인스타그램", "https://instagram.com/"],
    ["네이버 리뷰", "https://naver.me/"],
  ],
  footer: "주류는 만 19세 이상만 주문 가능합니다",
};

// ② 첫 방문 안내 (위에서부터 순서대로 보여요 / img는 비워두면 사진 없이 글만)
const GUIDE = [
  {
    title: "문래한잔은 이런 곳이에요",
    text: "혼자 와도 어색하지 않은 위스키 바예요.\n바텐더와 이야기 나누며 편하게 한 잔 하세요.",
    img: "",
  },
  {
    title: "이렇게 이용해요",
    text: "① 편한 자리에 앉아주세요\n② 메뉴판을 보고 직원에게 주문해 주세요\n③ 위스키가 처음이라면 취향만 말씀해 주세요. 골라드릴게요",
    img: "",
  },
  {
    title: "혼자 오셨나요?",
    text: "문래한잔 손님 대부분이 혼자 오세요.\n자리에 앉는 순간부터 오늘 밤은 혼자가 아니에요.",
    img: "",
  },
];

// ③ 메뉴판
const MENU = [
  {
    category: "위스키",
    desc: "1잔 기준",
    items: [
      { name: "예시 위스키 A", price: 12000, desc: "부드러운 바닐라 향", badge: "추천" },
      { name: "예시 위스키 B", price: 15000, desc: "스모키한 피트 향" },
    ],
  },
  {
    category: "하이볼",
    items: [
      { name: "예시 하이볼", price: 9000, desc: "가볍게 시작하기 좋은 한 잔" },
    ],
  },
  {
    category: "안주",
    items: [
      { name: "문래소세지", price: 15000, desc: "설명을 적어주세요" },
      { name: "올리브치즈바게트", price: 13000, desc: "설명을 적어주세요", soldout: true },
    ],
  },
];

// ④ 미니게임 목록 (위에서부터 순서대로 보여요)
//    빼고 싶으면 그 줄을 지우고, 새 게임은 파일을 올린 뒤 한 줄 추가
const GAMES = [
  { id: "race", file: "race.js", emoji: "🐌", title: "달팽이 경주", desc: "옆 손님과 한 판! 1등은 완전 랜덤" },
  { id: "pick", file: "pick.js", emoji: "🎰", title: "메뉴 랜덤뽑기", desc: "고민될 땐 운에 맡겨보세요" },
];

// =====================================================
// 아래는 건드리지 않아도 됩니다
// =====================================================

const app = document.getElementById("app");
const won = p => typeof p === "number" ? p.toLocaleString("ko-KR") + "원" : (p || "");
let observer;

const topbar = (title, extra = "", back = "#home") => `
  <div class="topbar">
    <div class="topbar-row"><a class="back" href="${back}">←</a><span class="topbar-title">${title}</span></div>
    ${extra}
  </div>`;

const views = {
  home: () => `
    <div class="home">
      <header>
        <div class="store">${STORE.name}</div>
        <div class="branch">${STORE.branch}</div>
        <p class="intro">${STORE.intro}</p>
      </header>
      <a class="big-btn" href="#first">
        <span><b>${STORE.firstBtn[0]}</b><small>${STORE.firstBtn[1]}</small></span><i>→</i>
      </a>
      <a class="big-btn primary" href="#menu">
        <span><b>${STORE.menuBtn[0]}</b><small>${STORE.menuBtn[1]}</small></span><i>→</i>
      </a>
      <a class="big-btn" href="#games">
        <span><b>${STORE.gameBtn[0]}</b><small>${STORE.gameBtn[1]}</small></span><i>→</i>
      </a>
      <div class="info">
        ${STORE.info.map(([k, v]) => `<div class="info-row"><span>${k}</span><span>${v}</span></div>`).join("")}
        <div class="links">${STORE.links.map(([t, u]) => `<a href="${u}" target="_blank">${t}</a>`).join("")}</div>
      </div>
    </div>`,

  first: () => `
    ${topbar(STORE.firstBtn[0])}
    <div class="guide">
      ${GUIDE.map(g => `
        <div class="guide-block">
          ${g.img ? `<img src="${g.img}" alt="" loading="lazy">` : ""}
          <h2>${g.title}</h2>
          <p>${g.text}</p>
        </div>`).join("")}
    </div>
    <a class="to-menu" href="#menu">메뉴판 보러가기 →</a>`,

  games: () => `
    ${topbar("미니게임")}
    <div class="games">
      ${GAMES.map(g => `
        <a class="big-btn" href="#g-${g.id}">
          <span class="game-emoji">${g.emoji}</span>
          <span class="game-text"><b>${g.title}</b><small>${g.desc}</small></span><i>→</i>
        </a>`).join("")}
    </div>`,

  menu: () => `
    ${topbar("메뉴판", `<nav>${MENU.map((c, i) => `<button data-i="${i}">${c.category}</button>`).join("")}</nav>`)}
    ${MENU.map((c, i) => `
      <section id="cat-${i}">
        <h2>${c.category}</h2>
        ${c.desc ? `<p class="cat-desc">${c.desc}</p>` : ""}
        ${c.items.map(it => `
          <div class="item${it.soldout ? " soldout" : ""}">
            ${it.img ? `<img src="${it.img}" alt="${it.name}" loading="lazy">` : ""}
            <div class="item-body">
              <div class="item-top">
                <span class="name">${it.name}${it.badge ? `<span class="badge">${it.badge}</span>` : ""}</span>
                <span class="price">${it.soldout ? "품절" : won(it.price)}</span>
              </div>
              ${it.desc ? `<p class="desc">${it.desc}</p>` : ""}
            </div>
          </div>`).join("")}
      </section>`).join("")}
    <footer>${STORE.footer}</footer>`,
};

function setupMenuNav() {
  const nav = document.querySelector("nav");
  const btns = [...nav.querySelectorAll("button")];
  btns.forEach(b => b.onclick = () =>
    document.getElementById("cat-" + b.dataset.i).scrollIntoView({ behavior: "smooth" }));

  observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const i = e.target.id.split("-")[1];
      btns.forEach(b => b.classList.toggle("on", b.dataset.i === i));
      const b = btns[i];
      nav.scrollTo({ left: b.offsetLeft - nav.clientWidth / 2 + b.clientWidth / 2, behavior: "smooth" });
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("section").forEach(s => observer.observe(s));
}

const loadedScripts = {};
function loadScript(src) {
  return loadedScripts[src] || (loadedScripts[src] = new Promise((ok, fail) => {
    const el = document.createElement("script");
    el.src = src + "?v=" + Date.now().toString().slice(0, 8);
    el.onload = ok;
    el.onerror = () => { delete loadedScripts[src]; fail(); };
    document.head.appendChild(el);
  }));
}

let currentGame = null;
async function mountGame(g) {
  const el = document.getElementById("game-root");
  el.innerHTML = `<p class="game-loading">${g.emoji} 불러오는 중…</p>`;
  try { await loadScript(g.file); } catch (e) {
    el.innerHTML = `<p class="game-loading">게임을 불러오지 못했어요. 새로고침해 주세요</p>`; return;
  }
  const mod = window.GameModules && window.GameModules[g.id];
  if (currentGame !== g.id || !mod) return;
  mod.mount(el, { STORE, MENU, won });
}

function route() {
  const key = location.hash.slice(1);
  let view = views[key] ? key : "home";
  const game = key.startsWith("g-") ? GAMES.find(g => g.id === key.slice(2)) : null;
  if (game) view = "game";

  if (observer) observer.disconnect();
  if (currentGame && window.GameModules && window.GameModules[currentGame]) window.GameModules[currentGame].unmount();
  currentGame = null;

  app.innerHTML = game
    ? `${topbar(game.title, "", "#games")}<div id="game-root"></div>`
    : views[view]();
  window.scrollTo(0, 0);

  if (view === "menu") setupMenuNav();
  if (game) { currentGame = game.id; mountGame(game); }
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
